<li class="entry">
  <a class="entry-link" href="{{ .RelPermalink }}">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
    <div>
      <h3 class="entry-title">{{ .Title }}{{ range .GetTerms "categories" }}<span class="post-tag">{{ .LinkTitle }}</span>{{ end }}</h3>
      {{ with .Description }}<p class="entry-desc">{{ . }}</p>{{ end }}
    </div>
  </a>
</li>
